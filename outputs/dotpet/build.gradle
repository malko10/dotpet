plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.dotpet'
version = '0.6.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.19.1'
    implementation 'net.java.dev.jna:jna-platform:5.19.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

javafx {
    version = '21.0.13'
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'com.dotpet.Main'
}

tasks.register('verifyDesktopUtilities', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dotpet.actions.DesktopUtilitiesCheck'
    args layout.buildDirectory.dir('utility-checks').get().asFile.absolutePath
}

// This main-based check runs above, without a JUnit dependency or test discovery.
tasks.named('test') {
    exclude 'com/dotpet/actions/DesktopUtilitiesCheck*.class'
}

tasks.named('check') {
    dependsOn tasks.named('verifyDesktopUtilities')
}
